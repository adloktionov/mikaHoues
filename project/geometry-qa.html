<!doctype html><html lang="ru"><meta charset="UTF-8"><title>Geometry QA — камеры</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;font:14px system-ui}header{height:70px;display:flex;align-items:center;gap:20px;padding:10px 20px}main{display:flex;width:1280px}figure{margin:0;width:640px}figcaption{height:25px;background:#fff;padding:3px 12px}.view,img{width:640px;height:480px;display:block;position:relative}.view canvas{display:block}.room-label{display:none}footer{padding:12px}select{font:inherit;padding:8px}#note{max-width:760px}</style><header><strong>Geometry QA</strong><select id="camera" aria-label="Камера"></select><span id="note"></span></header><main><figure><figcaption>Исходная фотография</figcaption><img id="source" alt="Исходное фото"></figure><figure><figcaption>Текущая 3D-геометрия · тот же формат 4:3</figcaption><div id="view" class="view"></div></figure></main><span id="ready"></span><footer id="pose"></footer><script type="module">
import data from './data/apartment-data.json';import {Viewer} from './src/viewer.js';
const select=document.querySelector('#camera'),v=new Viewer(document.querySelector('#view'),data,console.warn);v.setObjects(data.movableFurniture);v.grid.visible=false;
for(const p of data.photoCameras){const o=document.createElement('option');o.value=p.id;o.textContent=p.id+' · '+data.rooms.find(r=>r.id===p.room).label;select.append(o);}
async function show(){document.querySelector('#ready').textContent='';const p=data.photoCameras.find(p=>p.id===select.value);v.setPhoto(p);document.querySelector('#source').src=p.url;await document.querySelector('#source').decode();document.querySelector('#note').textContent=p.visibleSurfaces;document.querySelector('#pose').textContent=`${p.id} · камера ${p.position.map(x=>x.toFixed(2)).join(', ')} → ${p.target.map(x=>x.toFixed(2)).join(', ')} · FOV ${p.fov}° · позиция и FOV Estimated`;v.renderer.render(v.scene,v.camera);await new Promise(requestAnimationFrame);document.querySelector('#ready').textContent=p.id+' ready';}
select.addEventListener('change',show);show();
</script></html>
